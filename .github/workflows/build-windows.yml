name: Build Windows telemetry plugin
on:
  push:
    branches: [main]
    paths:
      - 'integrations/ets2-telemetry-plugin/**'
      - 'src/**'
      - 'sheets/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official SCS Telemetry SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'scs_sdk.zip'
          Invoke-WebRequest -Uri 'https://download.eurotrucksimulator2.com/scs_sdk_1_14.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'scs-sdk') -Force
          $header = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'scs-sdk') -Filter 'scssdk_telemetry.h' -Recurse | Select-Object -First 1
          if (-not $header) { throw 'Could not find scssdk_telemetry.h in official SDK archive.' }
          "SCS_SDK_INCLUDE_DIR=$($header.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build companion executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name TruckRacingCareer --paths src --add-data "sheets;sheets" src/launcher.py
      - name: Build native ETS2 plugin
        shell: pwsh
        run: |
          cmake -S integrations/ets2-telemetry-plugin -B build -A x64 "-DSCS_SDK_INCLUDE_DIR=$env:SCS_SDK_INCLUDE_DIR"
          cmake --build build --config Release
      - name: Package installable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/bin/win_x64/plugins | Out-Null
          Copy-Item dist/TruckRacingCareer.exe package/TruckRacingCareer.exe
          Copy-Item build/Release/TruckRacingCareer.dll package/bin/win_x64/plugins/TruckRacingCareer.dll
          Copy-Item README.md package/README.md
          Copy-Item docs/integration-notes.md package/INTEGRATION.md
          Compress-Archive -Path package/* -DestinationPath TruckRacingCareer-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TruckRacingCareer-Windows-x64
          path: TruckRacingCareer-Windows-x64.zip
          if-no-files-found: error
